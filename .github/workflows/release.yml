# Pacchetto precompilato per Linux x86_64 (doc 12.15, "Pacchetto precompilato").
# A ogni tag v* compila con dist/linux/package.sh e allega il tar.gz alla release del tag; a mano
# (workflow_dispatch) lascia il pacchetto come artifact dell'esecuzione. Il DLL di Dolby non c'è:
# lo aggiunge chi scarica.
#
# Firma (doc 12.15, "Aggiornamenti"): il tar.gz è firmato con minisign usando il secret
# MINISIGN_KEY (chiave segreta senza password; la pubblica è dist/linux/minisign.pub, compilata
# in os-update). Il .minisig va nella release accanto al .sha256; os-update rifiuta i pacchetti
# senza firma valida. Per un tag il secret è obbligatorio.
#
# Build in Debian 13: è la base stabile più vecchia con PipeWire >= 1.2, che serve al nodo
# (spa_io_clock.cycle, PW_STREAM_FLAG_ASYNC). Ubuntu 22.04 e Debian 12 non compilano libspa o il
# nodo; Ubuntu 24.04 ha PipeWire 1.0. I binari chiedono glibc 2.39.

name: release

# Il token di default può solo leggere; il job release chiede contents: write.
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    container: debian:13
    outputs:
      version: ${{ steps.ver.outputs.v }}
    steps:
      - name: Dipendenze di build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Versione
        id: ver
        shell: bash
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # I binari dicono la versione di Cargo.toml: deve essere quella del tag.
            if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
              echo "::error::il tag $GITHUB_REF_NAME non corrisponde a [workspace.package] version = \"$v\" in Cargo.toml"
              exit 1
            fi
            echo "v=$v" >> "$GITHUB_OUTPUT"
          else
            echo "v=$v-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pacchetto
        env:
          OS_GIT_COMMIT: ${{ github.sha }}
        run: |
          dist/linux/package.sh "${{ steps.ver.outputs.v }}"
          # Lo strumento di firma si compila qui, senza la chiave nell'ambiente: nel passo della
          # firma non gira nessuna build (né build script di crate di terzi) che possa leggerla.
          cargo build --locked -q -p os-update --example firma

      - name: Firma (minisign)
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          OS_GIT_COMMIT: ${{ github.sha }}
        run: |
          f=target/dist/open-surround-${{ steps.ver.outputs.v }}-linux-x86_64.tar.gz
          if [ -z "$MINISIGN_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::manca il secret MINISIGN_KEY: una release senza firma non si aggiorna dalla finestra"
              exit 1
            fi
            echo "::warning::secret MINISIGN_KEY assente: pacchetto non firmato"
            exit 0
          fi
          target/debug/examples/firma firma - "$f"
          unset MINISIGN_KEY
          # La chiave segreta deve corrispondere alla pubblica compilata in os-update.
          target/debug/examples/firma verifica dist/linux/minisign.pub "$f"

      - name: Prova del pacchetto (avvio dei binari, niente audio)
        shell: bash
        run: |
          d=target/dist/open-surround-${{ steps.ver.outputs.v }}-linux-x86_64
          "$d/bin/os-pipewire" --help > /dev/null
          "$d/bin/os-ctl" --help
          "$d/bin/os-ctl" versione
          "$d/bin/os-update" versione
          cat "$d/versione.json"
          "$d/open-surround" --help
          bash -n "$d/install.sh"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-surround-${{ steps.ver.outputs.v }}-linux-x86_64
          path: target/dist/*.tar.gz*

  release:
    if: github.ref_type == 'tag'
    needs: linux-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: open-surround-${{ needs.linux-x86_64.outputs.version }}-linux-x86_64

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz* --clobber
