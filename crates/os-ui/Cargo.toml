[package]
name = "os-ui"
description = "User interface with the controls of Dolby Access, over the profile model (phase 6)"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
os-profiles = { path = "../os-profiles" }
anyhow = "1"
# Niente backend Qt (servirebbe Qt6 installato): winit con FemtoVG, e il renderer software
# come ripiego.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

# Aggiornamenti (doc 12.15, "Aggiornamenti"): solo Linux, dove c'è l'installazione.
[target.'cfg(target_os = "linux")'.dependencies]
os-update = { path = "../os-update" }
# Scelta del DLL con il portale XDG (file chooser di GNOME/KDE, anche in Flatpak), senza GTK.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
# Backend di prova di Slint: clic e valori sugli elementi per etichetta accessibile, senza
# finestra vera (test dei clic in main.rs).
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "1.18"
