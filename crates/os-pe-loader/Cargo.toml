[package]
name = "os-pe-loader"
description = "Native PE32+ loader for Linux: maps a Windows DLL, resolves its imports with Rust shims, runs its TLS and DllMain"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"

# Il crate è vuoto fuori da Linux x86-64 (lib.rs): libc serve solo lì.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"
