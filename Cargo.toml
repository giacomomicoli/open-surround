[workspace]
resolver = "2"
members = [
    "crates/os-dap-core",
    "crates/os-dap-host",
    "crates/os-dap-linux",
    "crates/os-pe-loader",
    "crates/os-pipewire",
    "crates/os-profiles",
    "crates/os-ui",
    "crates/os-update",
    "crates/os-verify",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/giacomomicoli/open-surround"
authors = ["Giacomo Micoli"]

# Smart App Control blocca a volte le build release non firmate appena compilate: gli strumenti
# di verifica si usano dalla build debug, ottimizzata.
[profile.dev.package.os-verify]
opt-level = 3
